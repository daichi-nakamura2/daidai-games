<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>スタンプラリー 印刷用QR</title>
    <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700;800&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
    <style>
      @page { size: A4; margin: 8mm; }
      body { font-family: "Shippori Mincho B1", serif; color: #1c2a22; margin: 0; }
      .note { background: #fff4d6; padding: 12px 16px; margin: 12px; border-radius: 8px; font-size: 14px; line-height: 1.7; }
      .page { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 6mm; width: 194mm; height: 280mm; margin: 0 auto; page-break-after: always; }
      .poster { border: 1px solid #b07a2c; outline: 1px solid #b07a2c; outline-offset: -2mm; padding: 6mm; display: flex; flex-direction: column; align-items: center; justify-content: space-between; text-align: center; }
      .head { background: #1c2a22; color: #f4ead2; border-radius: 0; letter-spacing: 0.1em; padding: 2mm 5mm; font-weight: 900; font-size: 13pt; }
      .no { font-size: 11pt; margin-top: 2mm; }
      .shop { font-weight: 900; font-size: 14pt; line-height: 1.3; }
      .qr svg { width: 58mm; height: 58mm; display: block; }
      .code { font-size: 10pt; }
      .code b { color: #a8302c; font-size: 22pt; letter-spacing: 0.25em; display: block; }
      .guide { font-size: 9pt; color: #555; }
      .emoji { font-size: 20pt; }
      @media print { .note { display: none; } }
    </style>
  </head>
  <body>
    <div class="note">
      これは主催者用の印刷ページです（本番サーバーには置かれません）。<b>ブラウザの「印刷」でA4に4枚ずつ</b>出ます。<br />
      1枚目は受付用（参加QR＋スタッフPIN）。<b>スタッフPINは受付のスタッフだけに伝えてください</b>。
    </div>
    <div id="pages"></div>

    <script src="../public/booths.js"></script>
    <script src="codes.js"></script>
    <script>
      const qrSvg = (url) => {
        const q = qrcode(0, "M");
        q.addData(url);
        q.make();
        return q.createSvgTag({ cellSize: 4, margin: 2, scalable: true });
      };
      const R = window.RALLY;
      const cards = [];
      cards.push(`<div class="poster">
        <div class="head">${R.eventName} スタンプ帖</div>
        <div class="shop">参加はこちら</div>
        <div class="qr">${qrSvg(BASE_URL)}</div>
        <div class="guide">スマホのカメラで読んでスタート！<br>二つめからは帖の「QRを読んで押印」ボタンでお読みください</div>
      </div>`);
      cards.push(`<div class="poster">
        <div class="head">受付スタッフ用（掲示しない）</div>
        <div class="code">特典引き換えPIN<b>${STAFF_PIN}</b></div>
        <div class="guide" style="text-align:left">
          ① 参加者が「○○賞を受け取る」画面を見せる<br>
          ② 時計の秒が動いているか確認（スクショ対策）<br>
          ③「スタッフ確認」を押してPINを入力 → 受け取り済みになる<br><br>
          特典：${R.rewards.map((r) => `${r.count}こ＝${r.label}`).join("／")}
        </div>
      </div>`);
      R.booths.forEach((b, i) => {
        const url = `${BASE_URL}?b=${b.id}&c=${CODES[b.id]}`;
        cards.push(`<div class="poster">
          <div class="head">${R.eventName} スタンプ帖</div>
          <div class="no">其の${["一","二","三","四","五","六","七","八","九","十","十一","十二","十三","十四","十五","十六","十七","十八","十九","二十"][i] ?? i + 1}</div>
          <div class="shop">${b.shop}</div>
          <div class="qr">${qrSvg(url)}</div>
          <div class="code">読めないときの合言葉<b>${CODES[b.id]}</b></div>
          <div class="guide">スタンプ帖の「QRを読んで押印」ボタンで読むと朱印が押されます</div>
        </div>`);
      });
      let html = "";
      for (let i = 0; i < cards.length; i += 4) html += `<div class="page">${cards.slice(i, i + 4).join("")}</div>`;
      document.getElementById("pages").innerHTML = html;
    </script>
  </body>
</html>
