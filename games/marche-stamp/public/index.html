<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f1e6cc" />
    <title>ノザワナマルシェ スタンプ帖</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="masthead"><span>信州・松本</span><i></i><span>令和八年 秋号</span></div>

    <header class="hero">
      <div class="seal-mini">周遊<br />記念</div>
      <p class="kicker">ブースをめぐって集める</p>
      <h1><span class="h-a" id="eventName">ノザワナ</span><span class="h-b"><em>マルシェ</em>スタンプ帖</span></h1>
      <div class="rule"><i></i><b></b><i></i></div>

      <div class="progress">
        <div class="count"><b id="got">0</b><span>／<span id="total">13</span> 印</span></div>
        <div class="bar"><div class="fill" id="fill"></div><div id="marks"></div></div>
        <p class="next" id="next"></p>
      </div>
    </header>

    <main>
      <section class="howto" id="howto">
        <h2>遊び方</h2>
        <ol>
          <li><span>一</span>各ブースの <b>QRコード</b> をスマホのカメラで読む</li>
          <li><span>二</span>このスタンプ帖に朱印が押されます</li>
          <li><span>三</span>集まったら <b>受付</b> でこの画面を見せて特典を</li>
        </ol>
        <p class="small">QRが読めないときは、下の枠をタップしてブースの <b>四桁の合言葉</b> をご入力ください。</p>
      </section>

      <section id="rewards" class="rewards"></section>

      <section class="card">
        <h2 class="card-title"><i></i>朱印帖<i></i></h2>
        <div class="grid" id="grid"></div>
      </section>

      <p class="foot"><button class="link" id="resetBtn">記録をリセット</button></p>
    </main>

    <footer class="site-foot">
      <p class="f-name" id="fName">ノザワナマルシェ</p>
      <p class="f-info"><span id="fDate"></span><br /><span id="fPlace"></span></p>
    </footer>

    <!-- ブース詳細シート -->
    <div class="sheet" id="sheet" hidden>
      <div class="sheet-bg" data-close></div>
      <div class="sheet-body">
        <button class="x" data-close aria-label="閉じる">×</button>
        <div class="sheet-head">
          <div class="badge" id="sEmoji"></div>
          <div>
            <p class="s-no" id="sNo"></p>
            <h3 id="sShop"></h3>
            <p class="s-owner" id="sOwner"></p>
          </div>
        </div>
        <p class="s-menu" id="sMenu"></p>
        <div id="sAction"></div>
      </div>
    </div>

    <!-- 朱印の演出 -->
    <div class="stampfx" id="stampfx" hidden>
      <div class="fx-inner">
        <div class="hanko big" id="fxHanko"></div>
        <p class="fx-shop" id="fxShop"></p>
        <p class="fx-msg" id="fxMsg"></p>
        <button class="btn" id="fxOk">帖にもどる</button>
      </div>
    </div>

    <!-- 特典画面 -->
    <div class="cert" id="cert" hidden>
      <div class="cert-inner">
        <p class="cert-event" id="cEvent"></p>
        <h2 class="cert-title" id="cTitle"></h2>
        <div class="cert-seal"><span id="cCount"></span><small>印</small></div>
        <label class="cert-name">お名前 <input id="cName" maxlength="20" placeholder="ニックネームで結構です" /></label>
        <p class="cert-note" id="cNote"></p>
        <p class="clock" id="clock"></p>
        <div id="cStatus"></div>
        <button class="link light" id="cClose">帖にもどる</button>
      </div>
    </div>

    <div class="toast" id="toast" hidden></div>

    <script src="booths.js"></script>
    <script src="app.js"></script>
  </body>
</html>
