# Render にデプロイするのはこのプロジェクト1つだけ。
# ゲームを増やしてもサービスは増やさない（games/ にフォルダを足すだけ）。
services:
  - type: web
    name: daidai-games
    runtime: node
    # plan はあえて書かない。書くと push のたびにそのプランへ戻されることがある
    # (有料プランは Render → Settings → Instance Type で切り替える)
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20"
